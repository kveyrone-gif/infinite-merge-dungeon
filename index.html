<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Infinite Merge Dungeon</title><style>body{margin:0;background:#0b1020;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}#app{max-width:520px;margin:auto;padding:18px}.card{background:#151d33;border-radius:18px;padding:16px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.slot{height:72px;border:0;border-radius:12px;background:#202a45;color:white;font-size:16px}.sel{outline:3px solid #7c3aed}.btn{border:0;border-radius:12px;padding:13px;background:#7c3aed;color:white;font-weight:700}.btn.secondary{background:#26324f}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.muted{color:#aab4ca;font-size:13px}.bar{height:10px;background:#29334d;border-radius:9px;overflow:hidden}.fill{height:100%;background:#22c55e}</style></head><body><div id="app"></div><script>
const S=JSON.parse(localStorage.getItem('imd')||'null')||{floor:1,level:1,hp:100,max:100,gold:0,power:10,relics:Array(8).fill(null),msg:'Enter the dungeon.'}; if(S.relics.every(x=>x===null)){S.relics[0]=1;S.relics[1]=1}
let selected=null; const save=()=>localStorage.setItem('imd',JSON.stringify(S)); const msg=x=>{S.msg=x;save();render()};
function attack(){let enemy=25+S.floor*8, dmg=S.power+Math.max(0,...S.relics.map(x=>x||0))*5;if(dmg>=enemy){S.gold+=10+S.floor*2;S.floor++;S.hp=Math.min(S.max,S.hp+15);msg(S.floor%10===0?'BOSS DEFEATED!':'Victory! Floor '+S.floor)}else{S.hp-=Math.max(3,S.floor*2);if(S.hp<=0){S.hp=S.max;S.gold=Math.max(0,S.gold-5);msg('Defeated. You recovered.')}else msg('The enemy struck back. Attack again.')}}
function add(){let i=S.relics.indexOf(null);if(i<0)return msg('Board is full.');if(S.gold<10)return msg('Need 10 gold.');S.gold-=10;S.relics[i]=1;msg('New relic acquired.')}
function heal(){if(S.gold<15)return msg('Need 15 gold.');S.gold-=15;S.hp=S.max;msg('Fully healed.')}
function upgrade(){let c=25*S.level;if(S.gold<c)return msg('Need '+c+' gold.');S.gold-=c;S.level++;S.power+=5;S.max+=10;S.hp=S.max;msg('Hero upgraded to Lv.'+S.level)}
function prestige(){if(S.floor<20)return msg('Reach floor 20 to unlock Prestige.');Object.assign(S,{floor:1,level:1,hp:100,max:100,gold:0,power:10,relics:Array(8).fill(null)});S.relics[0]=1;msg('Prestige complete.')}
function tap(i){if(S.relics[i]==null)return;if(selected===null)selected=i;else if(selected===i)selected=null;else{let a=S.relics[selected],b=S.relics[i];if(a===b){S.relics[selected]=a+1;S.relics[i]=null;msg('Merged into Relic Lv.'+(a+1));return}msg('Merge two relics of the same level.');selected=null}render()}
function render(){document.getElementById('app').innerHTML=`<h1>∞ Infinite Merge Dungeon</h1><div class="row"><b>Floor ${S.floor}</b><b>🪙 ${S.gold}</b></div><div class="card"><h2>Hero Lv.${S.level}</h2><div class="bar"><div class="fill" style="width:${100*S.hp/S.max}%"></div></div><p class="muted">HP ${S.hp}/${S.max} · Power ${S.power}</p><button class="btn" onclick="attack()">⚔️ Attack</button></div><div class="card"><b>💎 Relic Board</b><div class="grid" style="margin-top:10px">${S.relics.map((r,i)=>`<button class="slot ${selected===i?'sel':''}" onclick="tap(${i})">${r?`💎<br>Lv.${r}`:'＋'}</button>`).join('')}</div></div><div class="buttons"><button class="btn secondary" onclick="add()">Add Relic · 10g</button><button class="btn secondary" onclick="heal()">Heal · 15g</button><button class="btn secondary" onclick="upgrade()">Hero Upgrade</button><button class="btn secondary" onclick="prestige()">Prestige</button></div><div class="card muted">${S.msg}</div>`}render();
</script></body></html>
